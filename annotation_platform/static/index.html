<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlignLedger 标注批次</title>
<style>body{max-width:850px;margin:40px auto;padding:0 18px;font:16px/1.7 -apple-system,"PingFang SC",sans-serif;background:#f3f0e9;color:#24251f}main{background:#fffdfa;padding:30px;border:1px solid #ddd7cb;border-radius:14px;box-shadow:0 3px 15px #30291c0c}h1{margin:0 0 8px;font-size:28px}.sub{color:#74776f;margin:0}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.metric{border:1px solid #ddd7cb;border-radius:9px;background:white;padding:7px 10px}.metric b{margin-left:4px}.good b{color:#18704f}.bad b{color:#b74432}.case-links{display:flex;gap:10px;margin:14px 0 20px}.case-links a{border:1px solid #ddd7cb;border-radius:8px;padding:8px 12px;text-decoration:none}.case-links .good{color:#18704f;border-color:#7fbba2}.case-links .bad{color:#b74432;border-color:#dc988e}a{color:#315d88;font-weight:700}ol{padding-left:28px}li{margin:7px 0;padding:5px 7px;border-radius:7px}li:hover{background:#f3f0e9}.counts{color:#74776f;font-size:14px;margin-left:6px}.counts .g{color:#18704f}.counts .b{color:#b74432}.progress{display:inline-block;width:88px;height:6px;margin-left:8px;vertical-align:middle;background:#e7e1d6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#315d88}.error{color:#b74432;padding:30px;text-align:center}@media(max-width:600px){body{margin:16px auto}main{padding:20px}.summary{display:grid;grid-template-columns:1fr 1fr}.case-links{flex-direction:column}}</style></head>
<body><main><h1>AlignLedger</h1><p class="sub" id="intro">正在读取批次数据…</p><section id="summary" class="summary"></section><nav class="case-links"><a class="good" id="good-link" href="review.html?kind=goodcase">Goodcase 汇总</a><a class="bad" id="bad-link" href="review.html?kind=badcase">Badcase 汇总</a></nav><ol id="batches"></ol></main>
<script>const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('zh-CN');async function load(){const r=await fetch('api/dashboard',{headers:{'X-Reviewer':'dashboard'}}),d=await r.json(),st=d.statuses||{},slots=d.total*5;$('#intro').textContent=`共 ${fmt(d.total)} 组 / ${fmt(slots)} SLOT。每批 ${fmt(d.batch_size)} 组；逐 SLOT 复核模型结果。`;$('#summary').innerHTML=[["已完成",st.submitted,''],["未标注",st.unreviewed,''],["进行中",st.in_progress,''],["Goodcase",d.goodcase,'good'],["Badcase",d.badcase,'bad']].map(([k,v,c])=>`<span class="metric ${c}">${k}<b>${fmt(v)}</b></span>`).join('');$('#good-link').textContent=`Goodcase 汇总（${fmt(d.goodcase)}）`;$('#bad-link').textContent=`Badcase 汇总（${fmt(d.badcase)}）`;$('#batches').innerHTML=d.batches.map(x=>{const p=x.total?Math.round(x.completed*100/x.total):0;return `<li><a href="review.html?batch=${x.batch}">annotation-batch-${String(x.batch).padStart(2,'0')}</a><span class="counts">— ${fmt(x.total)}组 / ${fmt(x.total*5)} SLOT · 已完成 ${fmt(x.completed)} · <span class="g">Good ${fmt(x.goodcase)}</span> · <span class="b">Bad ${fmt(x.badcase)}</span></span><span class="progress"><i style="width:${p}%"></i></span></li>`}).join('')}load().catch(()=>{document.querySelector('main').innerHTML='<div class="error">批次汇总加载失败，请稍后刷新。</div>'})</script></body></html>
