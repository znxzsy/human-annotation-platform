<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">AlignLedger workflow</title><desc id="desc">Data ingestion, annotation, second-pass review, adjudication, and frozen export.</desc>
  <defs><style>.t{font:700 24px Arial,sans-serif;fill:#182534}.s{font:15px Arial,sans-serif;fill:#5d6978}.p{fill:#fbfbfa;stroke:#aeb9c5;stroke-width:2}.b{fill:#32648f}.g{fill:#2f7759}.a{fill:#b77a31}.r{fill:#b84c3b}.line{stroke:#32648f;stroke-width:4;fill:none}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#32648f"/></marker></defs>
  <rect width="1500" height="650" fill="#fafaf8"/><text x="60" y="60" class="t" font-size="36">AUDITABLE HUMAN FEEDBACK PIPELINE</text><text x="60" y="94" class="s">Every decision keeps its author, revision, review result, and export status.</text><line x1="60" y1="122" x2="1440" y2="122" class="line"/>
  <g transform="translate(60 175)"><rect width="235" height="285" rx="12" class="p"/><circle cx="38" cy="38" r="18" class="b"/><text x="31" y="45" font-family="Arial" font-size="18" font-weight="700" fill="#fff">1</text><text x="68" y="46" class="t">Ingest</text><text x="25" y="94" class="s">Images + model output</text><text x="25" y="123" class="s">Stable record IDs</text><text x="25" y="152" class="s">Source hashes</text><rect x="25" y="190" width="185" height="58" rx="7" fill="#edf3f8" stroke="#9db5c8"/><text x="44" y="225" font-family="Arial" font-size="16" font-weight="700" fill="#2f5677">IMPORT MANIFEST</text></g>
  <g transform="translate(345 175)"><rect width="235" height="285" rx="12" class="p"/><circle cx="38" cy="38" r="18" class="g"/><text x="31" y="45" font-family="Arial" font-size="18" font-weight="700" fill="#fff">2</text><text x="68" y="46" class="t">Annotate</text><text x="25" y="94" class="s">Per-record decisions</text><text x="25" y="123" class="s">Corrections + notes</text><text x="25" y="152" class="s">Auto-save + idempotency</text><rect x="25" y="190" width="185" height="58" rx="7" fill="#edf7f2" stroke="#8bb49f"/><text x="61" y="225" font-family="Arial" font-size="16" font-weight="700" fill="#32634f">VERSIONED WRITE</text></g>
  <g transform="translate(630 175)"><rect width="235" height="285" rx="12" class="p"/><circle cx="38" cy="38" r="18" class="a"/><text x="31" y="45" font-family="Arial" font-size="18" font-weight="700" fill="#fff">3</text><text x="68" y="46" class="t">Review</text><text x="25" y="94" class="s">Random or batch sampling</text><text x="25" y="123" class="s">Accuracy + workload</text><text x="25" y="152" class="s">Reviewer attribution</text><rect x="25" y="190" width="185" height="58" rx="7" fill="#fff6e8" stroke="#d0a36c"/><text x="53" y="225" font-family="Arial" font-size="16" font-weight="700" fill="#8e5c24">SECOND PASS</text></g>
  <g transform="translate(915 175)"><rect width="235" height="285" rx="12" class="p"/><circle cx="38" cy="38" r="18" class="r"/><text x="31" y="45" font-family="Arial" font-size="18" font-weight="700" fill="#fff">4</text><text x="68" y="46" class="t">Adjudicate</text><text x="25" y="94" class="s">Resolve disagreements</text><text x="25" y="123" class="s">Write final labels</text><text x="25" y="152" class="s">Quarantine incomplete fixes</text><rect x="25" y="190" width="185" height="58" rx="7" fill="#fff0ed" stroke="#d7958b"/><text x="43" y="225" font-family="Arial" font-size="16" font-weight="700" fill="#934235">FINAL DECISION</text></g>
  <g transform="translate(1200 175)"><rect width="235" height="285" rx="12" class="p"/><circle cx="38" cy="38" r="18" class="b"/><text x="31" y="45" font-family="Arial" font-size="18" font-weight="700" fill="#fff">5</text><text x="68" y="46" class="t">Freeze</text><text x="25" y="94" class="s">Training-ready snapshot</text><text x="25" y="123" class="s">Manifest + SHA256</text><text x="25" y="152" class="s">Reproducible export</text><rect x="25" y="190" width="185" height="58" rx="7" fill="#edf3f8" stroke="#9db5c8"/><text x="45" y="225" font-family="Arial" font-size="16" font-weight="700" fill="#2f5677">FROZEN EXPORT</text></g>
  <path d="M295 318H335M580 318H620M865 318H905M1150 318H1190" class="line" marker-end="url(#m)"/>
  <rect x="60" y="510" width="1375" height="86" rx="10" fill="#eef2f5" stroke="#b9c3cd"/><text x="88" y="546" class="t">Provenance ledger</text><text x="88" y="575" class="s">actor · timestamp · revision · idempotency key · original label · review label · final label · export snapshot</text>
</svg>
