<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">人工标注平台</title>
  <desc id="desc">多 SLOT 视觉任务的标注、复核与质量闭环</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#173e5f"/><stop offset="1" stop-color="#315d88"/></linearGradient>
    <linearGradient id="paper" x1="0" x2="1"><stop stop-color="#fffdfa"/><stop offset="1" stop-color="#f4eee3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#102a42" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="170" fill="#f4bd60" opacity=".16"/><circle cx="75" cy="470" r="140" fill="#79b99f" opacity=".16"/>
  <g transform="translate(70 82)">
    <rect width="86" height="30" rx="15" fill="#e9b65e"/><text x="43" y="21" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="800" fill="#173e5f">HUMAN × AI</text>
    <text y="96" font-family="system-ui" font-size="58" font-weight="900" fill="white">人工标注平台</text>
    <text y="145" font-family="system-ui" font-size="24" fill="#dce9f2">把模型的“差不多”，变成人类确认过的“准确”。</text>
    <text y="191" font-family="system-ui" font-size="18" fill="#bcd0df">SLOT 级标注 · 二次复核 · 实名追踪 · 质量看板 · 可审计导出</text>
    <g transform="translate(0 235)">
      <rect width="134" height="45" rx="12" fill="#fffdfa"/><text x="67" y="29" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="800" fill="#234d6f">一键跑 Demo</text>
      <rect x="150" width="138" height="45" rx="12" fill="none" stroke="#86bfa7" stroke-width="2"/><text x="219" y="29" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="700" fill="#c8efdf">零前端依赖</text>
    </g>
  </g>
  <g transform="translate(720 58) rotate(2 205 202)" filter="url(#shadow)">
    <rect width="410" height="405" rx="22" fill="url(#paper)"/>
    <text x="28" y="42" font-family="system-ui" font-size="18" font-weight="800" fill="#252a26">SLOT 级复核</text>
    <g transform="translate(25 65)">
      <rect width="360" height="82" rx="14" fill="#edf8f3" stroke="#72b596" stroke-width="2"/>
      <text x="18" y="28" font-family="system-ui" font-size="13" font-weight="800" fill="#315d88">SLOT 1</text><text x="18" y="57" font-family="serif" font-size="22" fill="#252a26">38 + 27 = 65</text>
      <rect x="255" y="21" width="84" height="40" rx="10" fill="#1d7a55"/><text x="297" y="47" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="white">正确</text>
    </g>
    <g transform="translate(25 160)">
      <rect width="360" height="82" rx="14" fill="#fff2ef" stroke="#d98172" stroke-width="2"/>
      <text x="18" y="28" font-family="system-ui" font-size="13" font-weight="800" fill="#315d88">SLOT 2</text><text x="18" y="57" font-family="serif" font-size="22" fill="#252a26">72 − 19 = 52</text>
      <rect x="255" y="21" width="84" height="40" rx="10" fill="#bf4935"/><text x="297" y="47" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="white">需修正</text>
    </g>
    <g transform="translate(25 255)">
      <rect width="360" height="82" rx="14" fill="#f4f0fa" stroke="#a791c6" stroke-width="2"/>
      <text x="18" y="28" font-family="system-ui" font-size="13" font-weight="800" fill="#315d88">SLOT 3</text><text x="18" y="57" font-family="system-ui" font-size="17" fill="#252a26">图像模糊，进入 Unknown 池</text>
      <circle cx="316" cy="41" r="18" fill="#7a639d"/><text x="316" y="47" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="800" fill="white">?</text>
    </g>
    <rect x="25" y="355" width="360" height="26" rx="8" fill="#e8e1d5"/><rect x="25" y="355" width="276" height="26" rx="8" fill="#e3b15b"/>
  </g>
</svg>
