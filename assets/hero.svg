<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AlignLedger</title>
  <desc id="desc">Auditable human feedback infrastructure for model training.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#14354f"/><stop offset="1" stop-color="#315f86"/></linearGradient>
    <linearGradient id="paper" x1="0" x2="1"><stop stop-color="#fffdfa"/><stop offset="1" stop-color="#f3eee5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#102a42" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/><circle cx="1080" cy="70" r="170" fill="#e8b55e" opacity=".15"/><circle cx="75" cy="470" r="140" fill="#77b49b" opacity=".15"/>
  <g transform="translate(70 76)">
    <rect width="310" height="30" rx="15" fill="#e9b65e"/><text x="155" y="21" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1" fill="#173e5f">HUMAN FEEDBACK INFRASTRUCTURE</text>
    <text y="102" font-family="Arial,sans-serif" font-size="58" font-weight="900" fill="white">AlignLedger</text>
    <text y="153" font-family="Arial,sans-serif" font-size="24" fill="#dce9f2">Auditable annotation and review for model training</text>
    <text y="198" font-family="Arial,sans-serif" font-size="17" fill="#bcd0df">Auto-save · conflict control · provenance · quality ranking · frozen export</text>
    <g transform="translate(0 245)">
      <rect width="145" height="45" rx="11" fill="#fffdfa"/><text x="72.5" y="29" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="#234d6f">RUN THE DEMO</text>
      <rect x="163" width="168" height="45" rx="11" fill="none" stroke="#86bfa7" stroke-width="2"/><text x="247" y="29" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#c8efdf">STDLIB + SQLITE</text>
    </g>
  </g>
  <g transform="translate(720 58) rotate(2 205 202)" filter="url(#shadow)">
    <rect width="410" height="405" rx="22" fill="url(#paper)"/><text x="28" y="42" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#252a26">REVIEW QUEUE</text>
    <g transform="translate(25 65)"><rect width="360" height="82" rx="14" fill="#edf8f3" stroke="#72b596" stroke-width="2"/><text x="18" y="28" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#315d88">RECORD 01</text><text x="18" y="57" font-family="Georgia,serif" font-size="22" fill="#252a26">38 + 27 = 65</text><rect x="255" y="21" width="84" height="40" rx="10" fill="#1d7a55"/><text x="297" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="white">ACCEPT</text></g>
    <g transform="translate(25 160)"><rect width="360" height="82" rx="14" fill="#fff2ef" stroke="#d98172" stroke-width="2"/><text x="18" y="28" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#315d88">RECORD 02</text><text x="18" y="57" font-family="Georgia,serif" font-size="22" fill="#252a26">72 − 19 = 52</text><rect x="246" y="21" width="93" height="40" rx="10" fill="#bf4935"/><text x="292.5" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="white">CORRECT</text></g>
    <g transform="translate(25 255)"><rect width="360" height="82" rx="14" fill="#f4f0fa" stroke="#a791c6" stroke-width="2"/><text x="18" y="28" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#315d88">RECORD 03</text><text x="18" y="57" font-family="Arial,sans-serif" font-size="17" fill="#252a26">Blurred image · needs review</text><circle cx="316" cy="41" r="18" fill="#7a639d"/><text x="316" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="white">?</text></g>
    <rect x="25" y="355" width="360" height="26" rx="8" fill="#e8e1d5"/><rect x="25" y="355" width="276" height="26" rx="8" fill="#e3b15b"/>
  </g>
</svg>
