[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alignledger"
version = "0.1.0"
description = "An auditable human-feedback annotation and quality platform for model alignment."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "znxzsy"}]
keywords = ["annotation", "human-feedback", "model-alignment", "rlhf", "quality-control"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.setuptools]
packages = ["annotation_platform"]
include-package-data = true

[tool.setuptools.package-data]
annotation_platform = ["schema.sql", "static/*", "static/demo/*"]
